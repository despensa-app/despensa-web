<app-dsp-appbar title="Despensa"
                titleTag="span"
                [brand]="true">
  <app-dsp-theme-toggle dspEnd/>
</app-dsp-appbar>

<main class="dsp-shell">
  <app-dsp-hero title="Hola, usuario"
                titleTag="h1"/>

  <app-dsp-section title="En marcha"
                   count="Ordenadas por fecha">
    @for (response of shoppingListsRes().content; track response.id) {
      <app-shopping-list-card [response]="response"
                              (openActions)="openSheet('list-options-sheet')"
                              (selectedShoppingList)="selectedShoppingListEvent($event)"/>
    }
  </app-dsp-section>

  @if (showMoreButton().render) {
    <app-dsp-button type="button"
                    [block]="true"
                    styleClass="mb-4"
                    variant="outline-secondary"
                    [disabled]="showMoreButton().disabled"
                    (action)="showMoreButton().click()">
      Cargar más resultados
    </app-dsp-button>
  }
</main>

<app-shopping-list-card-sheet sheetId="list-options-sheet"
                              [response]="selectedShoppingList()"
                              (deleteShoppingList)="deleteShoppingListEvent($event)"/>

<app-tabbar-home/>

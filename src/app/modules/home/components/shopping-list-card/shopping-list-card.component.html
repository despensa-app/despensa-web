<app-dsp-card>
  <app-dsp-card-head>
    <a routerLink="/shopping-list/{{response().id}}"
       class="flex-grow-1 text-body text-decoration-none"
       style="min-width: 0;">
      <h3 class="dsp-card-title">{{ response().name }}</h3>
      <p class="dsp-card-meta">
        <span><i class="bi bi-shop"></i>Mercadona</span>
        <span><i class="bi bi-basket2"></i>{{ response().totalProducts }} productos</span>
        <span><i class="bi bi-receipt"></i>{{ response().totalPrice | number: '1.0-2' }} €</span>
      </p>
    </a>
    <button type="button"
            class="dsp-row-btn"
            (click)="openActionsEvent()"
            aria-label="Opciones de la lista">
      <i class="bi bi-three-dots-vertical"
         aria-hidden="true"></i>
    </button>
  </app-dsp-card-head>
</app-dsp-card>

<button type="button"
        class="dsp-option"
        [class.is-selected]="selected()"
        [class.is-danger]="danger()"
        [attr.data-bs-dismiss]="dismissSheet() ? 'offcanvas' : null"
        (click)="action.emit()">
  <i class="bi"
     [class]="icon()"></i>
  <span class="dsp-option-text">
    {{ text() }}
    @if (description()) {
      <small>{{ description() }}</small>
    }
  </span>
</button>
